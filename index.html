<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a38">
  <meta name="description" content="Trivia de rareza offline / Offline rare-answer trivia.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Abisal">
  <meta name="format-detection" content="telephone=no">
  <title>Abisal</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" id="apple-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- ===== ESCENA (fondo animado) ===== -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="world" id="world"></div>
    <div class="snow" id="snow"></div>
    <div class="bubbles" id="bubbles"></div>
    <div class="sub" id="sub">
      <div class="sub__light"></div>
      <div class="sub__tilt"><div class="sub__bob" id="subSprite"></div></div>
    </div>
    <div class="marker"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand__dot"></span>ABISAL</div>
      <div class="topbar__right">
        <span class="topbar__meta" id="dateLabel"></span>
        <div class="lang" id="langToggle" role="group" data-i18n-aria="langAria" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <!-- ===== INICIO / HOME ===== -->
    <section class="screen is-active" id="screen-home">
      <div class="home-top">
        <h1 class="hero__title">ABISAL</h1>
        <div class="home-intro">
          <p class="eyebrow" data-i18n="newDive">Nueva inmersión</p>
          <h2 class="question" data-i18n="homeTitle">¿Hasta dónde llegarás?</h2>
          <p class="home-cats" id="homeCats"></p>
        </div>
      </div>

      <div class="home-actions">
        <button class="btn btn--primary" id="btnPlay" data-i18n="startDive" disabled>Sumergirse ↓</button>
        <button class="btn btn--secondary" id="btnHistory" data-i18n="history" disabled>Inmersiones anteriores</button>
      </div>

      <div class="stats-row">
        <div class="stat"><span class="stat__label" data-i18n="record">Récord</span><span class="stat__value" id="statBest">0 m</span></div>
        <div class="stat"><span class="stat__label" data-i18n="today">Hoy</span><span class="stat__value" id="statToday">0 m</span></div>
        <div class="stat"><span class="stat__label" data-i18n="streak">Racha</span><span class="stat__value" id="statStreak">0</span></div>
      </div>
      <p class="bank-info" id="bankInfo"></p>
    </section>

    <!-- ===== JUEGO / GAME ===== -->
    <section class="screen" id="screen-game" aria-labelledby="gameQuestion">
      <div class="hud">
        <div class="card hud__panel sonar" id="sonar">
          <div class="sonar__depth"><span id="depthValue">0</span><small>m</small></div>
          <span class="sonar__zone" id="zoneName"></span>
          <div class="gauge" aria-hidden="true"><div class="gauge__diver" id="gaugeDiver"></div></div>
        </div>
        <div class="card hud__panel hud__progress">
          <ol class="dots" id="answerList" data-i18n-aria="progressAria"></ol>
          <span class="hud__round"><span data-i18n="dive">Pregunta</span> <b id="roundNum">1</b> / <b id="roundTotal">7</b></span>
        </div>
      </div>

      <div class="card qcard">
        <p class="qcard__label" id="gameCategory"></p>
        <h2 class="question question--game" id="gameQuestion"></h2>
        <p class="qcard__hint">▼ ▼ ▼</p>
      </div>

      <div class="spacer"></div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

      <div class="card reveal" id="reveal" role="status" aria-live="polite" hidden>
        <p class="reveal__verdict" id="revealVerdict"></p>
        <p class="reveal__best" id="revealBest"></p>
      </div>

      <div class="controls timer-row" id="timerRow">
        <div class="ring"><span class="timer__text" id="timerText" role="timer">25</span></div>
        <form class="answer-form" id="answerForm" autocomplete="off">
          <input id="answerInput" type="text" inputmode="text" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="send" maxlength="40"
                 data-i18n-ph="placeholder" data-i18n-aria="answerAria">
          <button class="btn btn--send" type="submit" data-i18n-aria="send">↓</button>
        </form>
        <button class="btn btn--primary btn--next" id="btnNext" type="button" hidden></button>
        <div class="timer"><div class="timer__bar" id="timerBar"></div></div>
      </div>
    </section>

    <!-- ===== RESULTADOS / RESULTS ===== -->
    <section class="screen" id="screen-results" aria-labelledby="resultTitle">
      <div class="card result-head">
        <p class="eyebrow" id="resultTitle" data-i18n="resultTitle">Resultado</p>
        <div class="result-depth"><span id="resultMeters">0</span><small>m</small></div>
        <p class="result-zone" id="resultZone"></p>
        <div class="result-tags">
          <span class="rarity-pill" id="resultRarity">—</span>
          <span class="badge" id="newRecord" data-i18n="newRecord" hidden></span>
        </div>
      </div>

      <div class="card">
        <h3 class="card__title" data-i18n="yourAnswers">Tus respuestas</h3>
        <ol class="summary" id="summaryList"></ol>
      </div>

      <p class="card hint" id="deepestHint"></p>

      <div class="stats-row">
        <div class="stat"><span class="stat__label" data-i18n="record">Récord</span><span class="stat__value" id="resBest">0 m</span></div>
        <div class="stat"><span class="stat__label" data-i18n="bestToday">Mejor hoy</span><span class="stat__value" id="resToday">0 m</span></div>
        <div class="stat"><span class="stat__label" data-i18n="games">Partidas</span><span class="stat__value" id="resGames">0</span></div>
      </div>

      <div class="actions">
        <button class="btn btn--primary" id="btnRetry"></button>
        <div class="actions__row">
          <button class="btn btn--ghost" id="btnShare" data-i18n="share">Compartir</button>
          <button class="btn btn--ghost" id="btnHome" data-i18n="home">Inicio</button>
        </div>
      </div>
    </section>

    <!-- ===== HISTORIAL / HISTORY ===== -->
    <section class="screen" id="screen-history">
      <div class="card">
        <h3 class="card__title" data-i18n="history">Inmersiones anteriores</h3>
        <p class="hint" id="historyEmpty" data-i18n="historyEmpty" hidden></p>
        <ol class="history" id="historyList"></ol>
      </div>
      <div class="actions">
        <button class="btn btn--ghost" id="btnHistoryBack" data-i18n="back">← Volver</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./generator.js" defer></script>
  <script src="./scene.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
